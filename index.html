  <style>
    :root{
      --bg:#06101d;
      --bg-2:#0a1627;
      --bg-3:#0f1e33;
      --panel:#0d1728;
      --panel-2:#12223a;
      --panel-3:rgba(18,34,58,.72);
      --line:rgba(255,255,255,.09);
      --line-strong:rgba(132,195,255,.28);
      --text:#edf4ff;
      --text-soft:#b9c8dc;
      --text-dim:#8ea0b7;
      --blue:#58a6ff;
      --blue-2:#81c2ff;
      --cyan:#77e6ff;
      --glow:0 10px 40px rgba(13,71,161,.18);
      --shadow:0 18px 60px rgba(0,0,0,.32);
      --radius:22px;
      --radius-sm:14px;
      --container:min(1200px, calc(100vw - 40px));
      --nav-h:84px;
      --transition:220ms ease;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-width:320px;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(88,166,255,.16), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(119,230,255,.10), transparent 24%),
        radial-gradient(circle at 50% 110%, rgba(88,166,255,.14), transparent 32%),
        linear-gradient(180deg, #07111f 0%, #081423 32%, #091524 100%);
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    ul{margin:0;padding:0;list-style:none}
    h1,h2,h3,p{margin:0}

    .skip-link{
      position:absolute;
      left:16px;
      top:-48px;
      z-index:1000;
      padding:10px 14px;
      border-radius:10px;
      background:#fff;
      color:#08111f;
      font-weight:700;
      transition:top var(--transition);
    }
    .skip-link:focus{top:16px}

    .site-bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:-1;
    }
    .site-bg::before,
    .site-bg::after{
      content:"";
      position:absolute;
      border-radius:999px;
      filter:blur(80px);
      opacity:.28;
    }
    .site-bg::before{
      width:420px;height:420px;
      left:-80px;top:120px;
      background:rgba(88,166,255,.35);
    }
    .site-bg::after{
      width:380px;height:380px;
      right:-60px;top:240px;
      background:rgba(119,230,255,.22);
    }

    .container{width:var(--container);margin-inline:auto}

    .site-header{
      position:sticky;
      top:0;
      z-index:200;
      backdrop-filter:saturate(140%) blur(10px);
      background:linear-gradient(180deg, rgba(6,16,29,.88), rgba(6,16,29,.68));
      border-bottom:1px solid transparent;
      transition:background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .site-header.scrolled{
      background:rgba(6,16,29,.88);
      border-color:var(--line);
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    #nav{
      height:var(--nav-h);
      display:flex;
      align-items:center;
    }

    .nav-inner{
      width:100%;
      display:grid;
      grid-template-columns:auto 1fr auto auto;
      align-items:center;
      gap:20px;
    }

    .nav-logo{
      display:inline-flex;
      align-items:center;
      min-width:0;
    }

    .nav-logo-img{
      width:auto;
      height:42px;
    }

    .nav-links{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:28px;
      min-width:0;
    }

    .nav-links a{
      position:relative;
      color:var(--text-soft);
      font-size:.96rem;
      font-weight:500;
      letter-spacing:.01em;
      transition:color var(--transition);
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-8px;
      width:100%;
      height:2px;
      transform:scaleX(0);
      transform-origin:left;
      background:linear-gradient(90deg, var(--blue), var(--cyan));
      transition:transform var(--transition);
    }

    .nav-links a:hover,
    .nav-links a:focus-visible{
      color:var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after{
      transform:scaleX(1);
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      font-weight:700;
      font-size:.95rem;
      line-height:1;
      border:1px solid transparent;
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition);
      cursor:pointer;
      white-space:nowrap;
    }

    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-1px);
    }

    .btn-primary{
      color:#07111f;
      background:linear-gradient(135deg, #7cc9ff 0%, #58a6ff 55%, #77e6ff 100%);
      box-shadow:0 12px 30px rgba(88,166,255,.24);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible{
      box-shadow:0 16px 36px rgba(88,166,255,.32);
    }

    .btn-secondary{
      color:var(--text);
      border-color:var(--line-strong);
      background:rgba(255,255,255,.02);
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible{
      border-color:rgba(129,194,255,.52);
      background:rgba(255,255,255,.05);
    }

    .hb{
      display:none;
      width:48px;
      height:48px;
      padding:0;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.03);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:5px;
      cursor:pointer;
    }

    .hb span{
      width:18px;
      height:2px;
      border-radius:999px;
      background:#fff;
      transition:transform var(--transition), opacity var(--transition);
    }

    .hb[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .hb[aria-expanded="true"] span:nth-child(2){opacity:0}
    .hb[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

    .mobile-panel{
      display:none;
      border-top:1px solid var(--line);
      background:rgba(7,17,31,.98);
    }

    .mobile-panel.open{display:block}

    .mobile-panel-inner{
      width:var(--container);
      margin-inline:auto;
      padding:16px 0 22px;
      display:grid;
      gap:10px;
    }

    .mobile-panel a{
      display:block;
      padding:14px 2px;
      color:var(--text-soft);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .mobile-actions{
      display:grid;
      gap:10px;
      padding-top:12px;
    }

    main{display:block}

    .hero{
      position:relative;
      padding:96px 0 56px;
      overflow:hidden;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:minmax(0, 1.08fr) minmax(360px, .92fr);
      gap:44px;
      align-items:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 14px;
      margin-bottom:22px;
      border:1px solid rgba(129,194,255,.24);
      border-radius:999px;
      color:var(--blue-2);
      background:rgba(88,166,255,.07);
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:999px;
      background:linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow:0 0 18px rgba(119,230,255,.7);
    }

    .hero h1{
      max-width:12ch;
      font-size:clamp(2.85rem, 6vw, 5.35rem);
      line-height:.96;
      letter-spacing:-.05em;
      font-weight:800;
      margin-bottom:20px;
    }

    .hero-copy{
      max-width:62ch;
      color:var(--text-soft);
      font-size:1.08rem;
      margin-bottom:30px;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-bottom:30px;
    }

    .proof-strip{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:14px;
      max-width:780px;
    }

    .proof-card{
      padding:18px 18px 16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      box-shadow:var(--glow);
    }

    .proof-card strong{
      display:block;
      margin-bottom:6px;
      font-size:1rem;
      color:var(--text);
    }

    .proof-card span{
      display:block;
      color:var(--text-dim);
      font-size:.92rem;
    }

    .hero-panel{
      position:relative;
      padding:22px;
      border:1px solid rgba(129,194,255,.20);
      border-radius:28px;
      background:
        linear-gradient(180deg, rgba(16,30,49,.92), rgba(10,20,35,.82)),
        radial-gradient(circle at top right, rgba(119,230,255,.14), transparent 32%);
      box-shadow:var(--shadow);
      overflow:hidden;
      isolation:isolate;
    }

    .hero-panel::before{
      content:"";
      position:absolute;
      inset:auto -80px -80px auto;
      width:220px;
      height:220px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(88,166,255,.24), transparent 70%);
      z-index:-1;
    }

    .panel-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .panel-title{
      font-size:.94rem;
      color:var(--text-soft);
      letter-spacing:.04em;
      text-transform:uppercase;
      font-weight:700;
    }

    .live-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      color:#dff7ff;
      font-size:.78rem;
      font-weight:700;
      background:rgba(119,230,255,.10);
      border:1px solid rgba(119,230,255,.18);
    }

    .live-badge::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:999px;
      background:#77e6ff;
      box-shadow:0 0 12px rgba(119,230,255,.7);
    }

    .signal-stack{
      display:grid;
      gap:14px;
      margin-bottom:18px;
    }

    .signal-card{
      padding:18px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      background:rgba(255,255,255,.03);
    }

    .signal-card small{
      display:block;
      margin-bottom:8px;
      color:var(--text-dim);
      font-size:.78rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-weight:700;
    }

    .signal-card strong{
      display:block;
      margin-bottom:8px;
      font-size:1.02rem;
    }

    .signal-card p{
      color:var(--text-soft);
      font-size:.95rem;
    }

    .micro-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
    }

    .micro-card{
      padding:16px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      background:rgba(255,255,255,.025);
    }

    .micro-card small{
      display:block;
      margin-bottom:6px;
      color:var(--text-dim);
      font-size:.76rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-weight:700;
    }

    .micro-card span{
      font-size:.98rem;
      font-weight:700;
      color:var(--text);
    }

    .section{
      padding:34px 0 92px;
    }

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:24px;
      margin-bottom:28px;
    }

    .section-head h2{
      font-size:clamp(1.9rem, 3.5vw, 3rem);
      line-height:1.02;
      letter-spacing:-.04em;
    }

    .section-head p{
      max-width:60ch;
      color:var(--text-soft);
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:18px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:18px;
    }

    .card{
      padding:24px;
      border-radius:22px;
      border:1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      box-shadow:var(--glow);
      transition:transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .card:hover{
      transform:translateY(-3px);
      border-color:rgba(129,194,255,.28);
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    }

    .card-kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:16px;
      color:var(--blue-2);
      font-size:.8rem;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .card h3{
      margin-bottom:10px;
      font-size:1.18rem;
      letter-spacing:-.02em;
    }

    .card p{
      color:var(--text-soft);
      font-size:.96rem;
      margin-bottom:18px;
    }

    .card-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--cyan);
      font-weight:700;
      font-size:.95rem;
    }

    .domain-card{
      min-height:220px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .feature-list{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .feature-list li{
      position:relative;
      padding-left:18px;
      color:var(--text-soft);
      font-size:.94rem;
    }

    .feature-list li::before{
      content:"";
      position:absolute;
      left:0;
      top:.62em;
      width:7px;
      height:7px;
      border-radius:999px;
      background:linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow:0 0 12px rgba(119,230,255,.48);
      transform:translateY(-50%);
    }

    .band{
      padding:22px 0;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.02);
      backdrop-filter:blur(8px);
    }

    .band-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
    }

    .band-item{
      padding:14px 16px;
      border:1px solid rgba(255,255,255,.05);
      border-radius:16px;
      background:rgba(255,255,255,.02);
    }

    .band-item strong{
      display:block;
      margin-bottom:6px;
      font-size:1rem;
    }

    .band-item span{
      color:var(--text-dim);
      font-size:.92rem;
    }

    .split{
      display:grid;
      grid-template-columns:minmax(0, .95fr) minmax(0, 1.05fr);
      gap:20px;
      align-items:stretch;
    }

    .stack{
      display:grid;
      gap:18px;
    }

    .timeline{
      display:grid;
      gap:14px;
    }

    .timeline-step{
      display:grid;
      grid-template-columns:54px 1fr;
      gap:16px;
      align-items:start;
      padding:18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(255,255,255,.02);
    }

    .timeline-no{
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      border-radius:18px;
      background:linear-gradient(135deg, rgba(88,166,255,.18), rgba(119,230,255,.12));
      border:1px solid rgba(129,194,255,.20);
      color:#dff1ff;
      font-weight:800;
      font-size:1rem;
    }

    .timeline-step h3{
      margin-bottom:6px;
      font-size:1.08rem;
    }

    .timeline-step p{
      color:var(--text-soft);
      font-size:.95rem;
    }

    .cta-block{
      position:relative;
      overflow:hidden;
      padding:30px;
      border-radius:28px;
      border:1px solid rgba(129,194,255,.24);
      background:
        linear-gradient(180deg, rgba(15,30,51,.92), rgba(9,21,36,.92)),
        radial-gradient(circle at right top, rgba(88,166,255,.12), transparent 32%);
      box-shadow:var(--shadow);
    }

    .cta-block::after{
      content:"";
      position:absolute;
      inset:auto -40px -80px auto;
      width:240px;
      height:240px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(119,230,255,.20), transparent 70%);
      pointer-events:none;
    }

    .cta-block h2{
      max-width:12ch;
      margin-bottom:12px;
      font-size:clamp(2rem, 4vw, 3.2rem);
      line-height:1;
      letter-spacing:-.04em;
    }

    .cta-block p{
      max-width:60ch;
      color:var(--text-soft);
      margin-bottom:22px;
    }

    .cta-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }

    .site-footer{
      border-top:1px solid var(--line);
      padding:34px 0 48px;
      background:rgba(0,0,0,.08);
    }

    .footer-grid{
      display:grid;
      grid-template-columns:1.3fr 1fr 1fr;
      gap:24px;
      align-items:start;
    }

    .footer-brand{
      display:grid;
      gap:16px;
    }

    .footer-brand img{
      height:42px;
      width:auto;
    }

    .footer-brand p{
      max-width:44ch;
      color:var(--text-dim);
    }

    .footer-col h3{
      margin-bottom:12px;
      font-size:.98rem;
      color:var(--text);
    }

    .footer-col ul{
      display:grid;
      gap:10px;
    }

    .footer-col a{
      color:var(--text-dim);
      transition:color var(--transition);
    }

    .footer-col a:hover,
    .footer-col a:focus-visible{
      color:var(--text);
    }

    .footer-bottom{
      margin-top:26px;
      padding-top:18px;
      border-top:1px solid rgba(255,255,255,.06);
      color:var(--text-dim);
      font-size:.92rem;
    }

    @media (max-width: 1120px){
      .nav-links{gap:20px}
      .hero-grid{grid-template-columns:1fr}
      .hero h1{max-width:14ch}

<!-- ═══════════════════════════════════════════
     SEO HEAD BLOCK — paste into <head> of every page
     Replace PAGE_TITLE, PAGE_DESC, PAGE_URL per page
═══════════════════════════════════════════ -->

<!-- Canonical -->
<link rel="canonical" href="PAGE_URL">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SIB Consulting | Ecosystem Intelligence Group">
<meta property="og:title" content="PAGE_TITLE">
<meta property="og:description" content="PAGE_DESC">
<meta property="og:url" content="PAGE_URL">
<meta property="og:image" content="https://www.teamsib.com/assets/images/eig-og-image.png">
<meta property="og:locale" content="en_GB">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PAGE_TITLE">
<meta name="twitter:description" content="PAGE_DESC">
<meta name="twitter:image" content="https://www.teamsib.com/assets/images/eig-og-image.png">

<!-- Schema.org — Organisation (homepage only) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "SIB Consulting",
  "alternateName": "Ecosystem Intelligence Group",
  "url": "https://www.teamsib.com",
  "logo": "https://www.teamsib.com/assets/images/SIB_logo.png",
  "description": "SIB Consulting operates the Ecosystem Intelligence Group, a multi-sector strategic intelligence and transformation platform serving organisations across UAE, GCC and MENA.",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Dubai",
    "addressCountry": "AE"
  },
  "areaServed": ["AE","SA","QA","KW","BH","OM","GB","US"],
  "sameAs": [
    "https://www.ecosystemintelligencegroup.com",
    "https://www.linkedin.com/company/ecosystem-intelligence-group"
  ],
  "knowsAbout": [
    "Agentic AI",
    "Artificial Intelligence",
    "Sustainability",
    "ESG",
    "Supply Chain",
    "Architecture",
    "Education",
    "Healthcare",
    "Information Technology",
    "Strategic Planning"
  ]
}
</script>

<!-- Schema.org — WebSite with SearchAction -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "SIB Consulting | Ecosystem Intelligence Group",
  "url": "https://www.teamsib.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://www.teamsib.com/domains.html?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Schema.org — BreadcrumbList (update per page) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://www.teamsib.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "PAGE_TITLE",
      "item": "PAGE_URL"
    }
  ]
}
</script>
